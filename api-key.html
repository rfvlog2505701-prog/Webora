<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API key — Webora</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f4ff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/wevlo.css">
</head>
<body>
<script src="/assets/boot.js" data-label="Loading API key…"></script>
<main class="wrap mid">
<div class="eyebrow">Developer</div><h1>API key</h1>
<p class="sub">Publish websites programmatically without logging into the dashboard.</p>
<div class="card reveal"><div class="card-h">Your key</div><div class="card-b">
<div id="keyArea"><p class="sub" style="margin:0">Loading…</p></div>
<div class="row" style="margin-top:14px"><button class="btn primary" id="createKeyBtn">Generate new key</button><button class="btn danger" id="revokeBtn" style="display:none">Revoke key</button></div>
<div id="st" class="status"></div>
</div><div class="card-f">Need the request format? <a class="link" href="/app/api-docs">Read the API documentation</a></div></div>
</main>
<script type="module">
import { mountHeader, setAvatar, hideLoader, esc, $, status } from "/assets/layout.js";
import { auth, onAuthStateChanged, signOut } from "/assets/firebase-client.js";
mountHeader("app", async () => { await signOut(auth); location.href = "/"; });
let user = null;
const call = async (opts = {}) => fetch("/api/apikey", { ...opts, headers: { Authorization: "Bearer " + (await user.getIdToken()) } });
function show(k) {
  $("keyArea").innerHTML = k ? `<div class="keybox"><code>${esc(k)}</code></div>` : `<p class="sub" style="margin:0">No API key yet.</p>`;
  $("revokeBtn").style.display = k ? "inline-flex" : "none";
}
onAuthStateChanged(auth, async (u) => {
  if (!u) return (location.href = "/auth/login?next=/app/api-key");
  user = u; setAvatar(u);
  show((await (await call()).json()).apiKey); hideLoader();
});
$("createKeyBtn").onclick = async () => {
  $("createKeyBtn").disabled = true;
  try { const r = await call({ method: "POST" }), j = await r.json(); if (!r.ok) throw new Error(j.error || "Could not create key."); show(j.apiKey); status("st", "New key generated — copy it now.", "ok"); }
  catch (e) { status("st", e.message, "err"); }
  finally { $("createKeyBtn").disabled = false; }
};
$("revokeBtn").onclick = async () => {
  if (!confirm("Revoke your API key? Anything using it will stop working.")) return;
  try { const r = await call({ method: "DELETE" }); if (!r.ok) throw new Error("Could not revoke key."); show(null); status("st", "Key revoked.", "ok"); }
  catch (e) { status("st", e.message, "err"); }
};
</script>
</body>
</html>
