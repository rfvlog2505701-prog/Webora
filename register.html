<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — Webora</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030814">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<script src="/assets/boot.js" data-label="Loading…"></script>
<main class="wrap narrow">
<div class="eyebrow">Account</div><h1>Create account</h1>
<div class="card reveal"><div class="card-b">
<div id="step1">
<button class="btn outline block" id="googleBtn" type="button"></button>
<div class="divider">OR</div>
<div class="field"><label>Gmail address</label><input id="email" type="email" placeholder="you@gmail.com" autocomplete="email"><small>Email sign-up requires a @gmail.com address.</small></div>
<div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 6 characters" autocomplete="new-password"></div>
<button class="btn primary block" id="sendBtn">Send verification code</button>
<div id="st1" class="status"></div>
</div>
<div id="step2" style="display:none">
<p class="sub" style="margin-top:0">We emailed a 6-digit code to <b id="shown"></b>.</p>
<div class="field"><label>Verification code</label><input id="code" maxlength="6" inputmode="numeric" placeholder="123456"></div>
<div class="row"><button class="btn outline" id="resendBtn" type="button">Resend code</button><button class="btn primary" id="verifyBtn">Create account</button></div>
<div id="st2" class="status"></div>
</div>
</div><div class="card-f">Already have an account? <a class="link" href="/login.html">Log in</a></div></div>
</main>
<script type="module">
import { mountHeader, icons, $, status } from "/assets/layout.js";
import { auth, createUserWithEmailAndPassword } from "/assets/firebase-client.js";
import { redirectIfLoggedIn, googleLogin, goNext, saveProfile } from "/assets/auth.js";
mountHeader("public"); redirectIfLoggedIn();
$("googleBtn").innerHTML = icons.google + " Continue with Google";
$("googleBtn").onclick = () => googleLogin().catch((e) => status("st1", e.message, "err"));
let pw = "";
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || "Request failed."); return j; });
$("sendBtn").onclick = async () => {
  const email = $("email").value.trim().toLowerCase(); pw = $("password").value;
  if (!/^[a-z0-9._%+-]+@gmail\.com$/i.test(email)) return status("st1", "Use a valid @gmail.com address.", "err");
  if (pw.length < 6) return status("st1", "Password must be at least 6 characters.", "err");
  $("sendBtn").disabled = true;
  try {
    await post("/api/create-otp", { email });
    $("shown").textContent = email; $("step1").style.display = "none"; $("step2").style.display = "block";
    status("st2", "Code sent — check your inbox.", "ok");
  } catch (e) { status("st1", e.message, "err"); }
  finally { $("sendBtn").disabled = false; }
};
$("resendBtn").onclick = async () => {
  try { await post("/api/create-otp", { email: $("shown").textContent }); status("st2", "New code sent.", "ok"); }
  catch (e) { status("st2", e.message, "err"); }
};
$("verifyBtn").onclick = async () => {
  const email = $("shown").textContent, code = $("code").value.trim();
  if (!code) return status("st2", "Enter the 6-digit code.", "err");
  $("verifyBtn").disabled = true;
  try {
    await post("/api/verify-otp", { email, code });
    const cred = await createUserWithEmailAndPassword(auth, email, pw);
    await saveProfile(cred.user, "password"); goNext();
  } catch (e) { status("st2", e.message.replace("Firebase: ", ""), "err"); }
  finally { $("verifyBtn").disabled = false; }
};
</script>
</body>
</html>
