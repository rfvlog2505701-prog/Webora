<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#172033}
#message{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
#message h1{font-size:28px;margin-bottom:10px}
#message p{color:#718096}
#siteFrame{display:none;width:100%;height:100vh;border:0;background:white}
</style>
</head>
<body>
<div id="message">
  <h1>Loading website...</h1>
  <p>Please wait.</p>
</div>
<iframe id="siteFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>

<script>
const DB="https://testfirebase-872d3-default-rtdb.firebaseio.com";

function showError(title,detail){
  document.getElementById("message").innerHTML=
    `<h1>${title}</h1><p>${detail}</p>`;
}

function buildDocument(html,css,js){
  const safeJS=(js||"").replace(/<\/script/gi,"<\\/script");
  let doc=(html||"").trim();

  if(!doc) doc="<!DOCTYPE html><html><head></head><body></body></html>";
  if(!/<html[\s>]/i.test(doc)){
    doc="<!DOCTYPE html><html><head></head><body>"+doc+"</body></html>";
  }

  if(/<\/head>/i.test(doc)){
    doc=doc.replace(/<\/head>/i,`<style>${css||""}</style></head>`);
  }else{
    doc=doc.replace(/<html[^>]*>/i,m=>m+"<head><style>"+(css||"")+"</style></head>");
  }

  if(/<\/body>/i.test(doc)){
    doc=doc.replace(/<\/body>/i,`<script>${safeJS}<\/script></body>`);
  }else{
    doc+=`<script>${safeJS}<\/script>`;
  }
  return doc;
}

async function loadSite(){
  const parts=location.pathname.split("/").filter(Boolean);
  const username=decodeURIComponent(parts[0]||"");

  if(!username || username==="index.html" || username==="site.html"){
    showError("Website not found","This website does not exist.");
    return;
  }

  try{
    const response=await fetch(
      `${DB}/sites/${encodeURIComponent(username)}.json`
    );

    if(!response.ok) throw new Error("Could not connect to the database.");

    const site=await response.json();

    if(!site || !site.html){
      showError("Website not found","This website does not exist.");
      return;
    }

    document.title=site.username||"Website";
    document.getElementById("message").style.display="none";

    const frame=document.getElementById("siteFrame");
    frame.srcdoc=buildDocument(site.html,site.css,site.js);
    frame.style.display="block";
  }catch(error){
    showError("Unable to load website",error.message);
  }
}

loadSite();
</script>
</body>
</html>
